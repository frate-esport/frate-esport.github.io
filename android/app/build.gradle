plugins { id "com.android.application" }
android {
    namespace "fr.frate.esport"
    compileSdk 34
    defaultConfig {
        applicationId "fr.frate.esport"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }
    // Clé de signature fixe (clé « debug » standard, mot de passe android) : les mises à jour de l'appli s'installent par-dessus l'ancienne.
    signingConfigs { debug { storeFile file("frate-debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }
    buildTypes { debug { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
