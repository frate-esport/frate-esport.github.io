name: Appli Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Construire l'APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Préparer le fichier
        run: cp android/app/build/outputs/apk/debug/app-debug.apk frate-esport.apk
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: Appli Fraté Esport 1.0.${{ github.run_number }}
          body: "Appli Android officielle de Fraté Esport. Télécharge frate-esport.apk sur ton téléphone puis ouvre-le pour l'installer."
          files: frate-esport.apk
          make_latest: true
